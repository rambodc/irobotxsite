name: "Production: Firebase Functions"
on:
  workflow_call:
    inputs:
      targets:
        type: string
        default: functions
  workflow_dispatch:
permissions: { contents: write, id-token: write }
jobs:
  deploy:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --prefix functions
      - run: npm test --prefix functions
      - run: npm run lint --prefix functions
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      - run: npm install --global firebase-tools@14.15.2
      - name: Deploy affected functions
        env:
          FUNCTION_TARGETS: ${{ inputs.targets || 'functions' }}
        run: firebase deploy --only "$FUNCTION_TARGETS" --project irobotxsite --non-interactive
      - name: Record successful functions deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/record-deployment.mjs functions
