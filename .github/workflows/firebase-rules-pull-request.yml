name: "PR: Firebase Rules"
on: [pull_request]
permissions: { contents: read }
concurrency:
  {
    group: "rules-pr-${{ github.event.pull_request.number }}",
    cancel-in-progress: true,
  }
jobs:
  validate:
    name: rules-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm ci --prefix functions
      - run: npm run lint --prefix functions && npm test --prefix functions
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --global firebase-tools@14.15.2
      - run: npm run test:rules
      - run: TEST_MAIL_FAILURE=true npm run test:rules
