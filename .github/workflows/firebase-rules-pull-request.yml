name: "PR: Firebase Rules"
on: [pull_request]
permissions: { contents: read }
concurrency:
  {
    group: "rules-pr-${{ github.event.pull_request.number }}",
    cancel-in-progress: true,
  }
jobs:
  validate:
    name: rules-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VALIDATION: 'true'
        run: node scripts/change-scope.mjs
      - run: node --test tests/change-scope.test.mjs
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.rules == 'true'
        with: { node-version: 22, cache: npm }
      - run: npm ci
        if: steps.changes.outputs.rules == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.changes.outputs.rules == 'true'
      - run: npm ci --prefix functions
        if: steps.changes.outputs.rules == 'true'
      - run: npm run lint --prefix functions && npm test --prefix functions
        if: steps.changes.outputs.rules == 'true'
      - uses: actions/setup-java@v4
        if: steps.changes.outputs.rules == 'true'
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --global firebase-tools@14.15.2
        if: steps.changes.outputs.rules == 'true'
      - run: npm run test:rules
        if: steps.changes.outputs.rules == 'true'
      - run: TEST_MAIL_FAILURE=true npm run test:rules
        if: steps.changes.outputs.rules == 'true'
